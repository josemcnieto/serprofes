<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración</title>

    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <!-- HEADER -->
        <header class="dashboard-header">
            <h1>Panel de Administración</h1>
            <p>Gestión de usuarios y suscripciones</p>
        </header>


        <!-- FORMULARIO -->
        <section class="card">

            <h2>1. Añadir Suscriptor</h2>

            <form id="suscipcioForm" class="formularios">

                <!-- Nombre -->
                <div class="input-group">

                    <label for="nombreInput">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombreInput"
                        placeholder="Ej. Ada Lovelace"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="emailInput">
                        Email
                    </label>

                    <input
                        type="email"
                        id="emailInput"
                        placeholder="Ej. ada@email.com"
                        required
                    >

                </div>


                <!-- Rol -->
                <div class="input-group">

                    <label for="rolInput">
                        Rol
                    </label>

                    <select id="rolInput" required>

                        <option value="">
                            Selecciona un rol
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                        <option value="Editor">
                            Editor
                        </option>

                        <option value="Usuario">
                            Usuario
                        </option>

                    </select>

                </div>


                <!-- Botón -->
                <button type="submit" class="btn btn-primary">
                    Suscribir Usuario
                </button>

            </form>


            <!-- Mensaje de éxito -->
            <div id="mensajeExito" class="alerta oculto"></div>

        </section>



        <!-- TABLA -->
        <section class="card">

            <h2>2. Base de Datos de Usuarios</h2>

            <!-- Buscador -->
            <div class="input-group">

                <input
                    type="text"
                    id="buscadorUsuarios"
                    placeholder="🔍 Buscar por nombre, email o rol..."
                >

            </div>


            <!-- Tabla -->
            <table id="tablaUsuarios" class="tabla-admin">

                <thead>

                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                    </tr>

                </thead>


                <tbody>

                    <tr>
                        <td>Jorge Daniel</td>
                        <td>jorge@agencia.com</td>
                        <td>Admin</td>
                    </tr>

                    <tr>
                        <td>Jose Manuel</td>
                        <td>jose@agencia.com</td>
                        <td>Usuario</td>
                    </tr>

                    <tr>
                        <td>Rafal Wysocki</td>
                        <td>rafal@agencia.com</td>
                        <td>Editor</td>
                    </tr>

                    <tr>
                        <td>Lewis Sanchez</td>
                        <td>lewis@agencia.com</td>
                        <td>Usuario</td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
