<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Arquitectura Moderna</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Encabezado -->
        <header class="pb-3 mb-4 border-bottom">
            <h1 class="display-6 fw-bold text-dark">
                <i class="bi bi-building"></i> Arquitectura Moderna
            </h1>
            <p class="text-muted">Catálogo e inventario de obras emblemáticas</p>
        </header>

        <div class="row g-4">
            <!-- Formulario (Crear / Editar) -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        <span id="form-title">Registrar Edificio</span>
                    </div>
                    <div class="card-body">
                        <form id="form-edificio">
                            <input type="hidden" id="edificio-id">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Edificio</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Villa Savoye" required>
                            </div>

                            <div class="mb-3">
                                <label for="arquitecto" class="form-label">Arquitecto</label>
                                <input type="text" class="form-control" id="arquitecto" placeholder="Ej: Le Corbusier" required>
                            </div>

                            <div class="mb-3">
                                <label for="ciudad" class="form-label">Ciudad / Ubicación</label>
                                <input type="text" class="form-control" id="ciudad" placeholder="Ej: Poissy, Francia" required>
                            </div>

                            <div class="mb-3">
                                <label for="anio" class="form-label">Año de Construcción</label>
                                <input type="number" class="form-control" id="anio" placeholder="Ej: 1931" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark" id="btn-guardar">
                                    <i class="bi bi-plus-lg"></i> Guardar
                                </button>
                                <button type="button" class="btn btn-outline-secondary d-none" id="btn-cancelar">
                                    Cancelar Edición
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center py-3">
                        <span>Obras Registradas</span>
                        <button class="btn btn-sm btn-outline-dark" onclick="cargarEdificios()">
                            <i class="bi bi-arrow-clockwise"></i> Recargar
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Edificio</th>
                                        <th>Arquitecto</th>
                                        <th>Ciudad</th>
                                        <th>Año</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-edificios">
                                    <!-- Se puebla dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                        <div id="sin-datos" class="text-center py-4 text-muted d-none">
                            No hay edificios registrados en el sistema.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript para conectar con la API -->
    <script>
        const API_URL = "http://localhost:3000/api/edificios";

        // Referencias al DOM
        const form = document.getElementById("form-edificio");
        const edificioIdInput = document.getElementById("edificio-id");
        const nombreInput = document.getElementById("nombre");
        const arquitectoInput = document.getElementById("arquitecto");
        const ciudadInput = document.getElementById("ciudad");
        const anioInput = document.getElementById("anio");
        const formTitle = document.getElementById("form-title");
        const btnGuardar = document.getElementById("btn-guardar");
        const btnCancelar = document.getElementById("btn-cancelar");
        const tablaBody = document.getElementById("tabla-edificios");
        const sinDatosDiv = document.getElementById("sin-datos");

        // Cargar registros al iniciar la página
        document.addEventListener("DOMContentLoaded", cargarEdificios);

        // 1. OBTENER (GET)
        async function cargarEdificios() {
            try {
                const res = await fetch(API_URL);
                const edificios = await res.json();
                renderTabla(edificios);
            } catch (error) {
                console.error("Error al cargar los datos:", error);
                alert("No se pudo conectar con el servidor backend.");
            }
        }

        // Renderizar filas en la tabla
        function renderTabla(edificios) {
            tablaBody.innerHTML = "";
            
            if (edificios.length === 0) {
                sinDatosDiv.classList.remove("d-none");
                return;
            }
            sinDatosDiv.classList.add("d-none");

            edificios.forEach(e => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>#${e.id}</strong></td>
                    <td class="fw-medium">${e.nombre}</td>
                    <td>${e.arquitecto}</td>
                    <td>${e.ciudad}</td>
                    <td><span class="badge bg-secondary">${e.anio}</span></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="prepararEdicion(${e.id}, '${e.nombre}', '${e.arquitecto}', '${e.ciudad}', ${e.anio})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarEdificio(${e.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tablaBody.appendChild(tr);
            });
        }

        // 2. CREAR / ACTUALIZAR (POST / PUT)
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const id = edificioIdInput.value;
            const edificioData = {
                nombre: nombreInput.value.trim(),
                arquitecto: arquitectoInput.value.trim(),
                ciudad: ciudadInput.value.trim(),
                anio: parseInt(anioInput.value)
            };

            try {
                let response;
                if (id) {
                    // Si hay un ID guardado, hacemos un PUT para actualizar
                    response = await fetch(`${API_URL}/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(edificioData)
                    });
                } else {
                    // Si no hay ID, hacemos un POST para crear uno nuevo
                    response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(edificioData)
                    });
                }

                if (response.ok) {
                    resetForm();
                    cargarEdificios();
                } else {
                    const err = await response.json();
                    alert(`Error: ${err.error}`);
                }
            } catch (error) {
                console.error("Error en la petición:", error);
            }
        });

        // 3. PREPARAR EDICIÓN (Cargar datos en el formulario)
        function prepararEdicion(id, nombre, arquitecto, ciudad, anio) {
            edificioIdInput.value = id;
            nombreInput.value = nombre;
            arquitectoInput.value = arquitecto;
            ciudadInput.value = ciudad;
            anioInput.value = anio;

            formTitle.textContent = "Editar Edificio";
            btnGuardar.innerHTML = '<i class="bi bi-check-lg"></i> Actualizar';
            btnCancelar.classList.remove("d-none");
        }

        btnCancelar.addEventListener("click", resetForm);

        function resetForm() {
            edificioIdInput.value = "";
            form.reset();
            formTitle.textContent = "Registrar Edificio";
            btnGuardar.innerHTML = '<i class="bi bi-plus-lg"></i> Guardar';
            btnCancelar.classList.add("d-none");
        }

        // 4. ELIMINAR (DELETE)
        async function eliminarEdificio(id) {
            if (!confirm(`¿Estás seguro de que deseas eliminar el edificio #${id}?`)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE"
                });

                if (response.ok) {
                    cargarEdificios();
                } else {
                    const err = await response.json();
                    alert(`Error: ${err.error}`);
                }
            } catch (error) {
                console.error("Error al eliminar:", error);
            }
        }
    </script>
</body>
</html>
