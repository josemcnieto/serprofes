<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia - Componentes DOM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="top-bar">
        <label class="switch-container">
            <input type="checkbox" id="themeToggle">
            <span class="switch-text">Activar Modo Oscuro</span>
        </label>
    </header>
    <main class="contenedor-principal">
    <!-- Contador de Clicks -->
     <section class="card">
        <h2>1. Panel de Metricas</h2>
        <button id="countBtn" class="btn btn-primary">Registrar clic</button>
        <p class="resultado"></p> Interacciones: <span id="count" class="badge"></span></p>
     </section>

     <!-- Menu Toggle -->
      <section class="card">
        <h2>2. Navegacion Oculta</h2>
        <button id="menuToggle" class="btn btn-secondary">Mostrar Menu</button>
            <!-- la clase oculto mantendra esta invisible inicialmente -->
             <nav id="mainNav" class="oculto menu-desplegable">
                <ul>
                    <li><a href="#">Panel de Control</a></li>
                    <li><a href="#">Ajuste de Cuenta</a></li>
                    <li><a href="#">Cerrar Sesion</a></li>
                </ul>
             </nav>
      </section>

      <!-- Procesar Pago -->
<section class="card">
    <h2>3. Procesar Pago 💳</h2>

    <p class="descripcion">
        Protege el sistema contra múltiples pagos accidentales.
    </p>

    <button id="payBtn" class="btn btn-pay">
        💰 Realizar Pago
    </button>

    <p id="estadoPago" class="mensaje-pago"></p>
</section>
      </main>
</body>

</html>
